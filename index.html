<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARAM: Hỗn Loạn — Tra cứu build lõi & đồ</title>
<meta name="description" content="Tra cứu build ARAM Mayhem bằng tiếng Việt: lõi, trang bị, phép bổ trợ; đối chiếu nguồn và ngày cập nhật.">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0b0e13; --panel:#141a22; --panel2:#1a212c; --panel3:#212a38;
    --line:#28313f; --txt:#e6edf3; --dim:#8b96a5; --accent:#4fd1e6;
    --silver:#b9c2d0; --silver-bg:#2a3140;
    --gold:#f0b93b; --gold-bg:#3a2f16;
    --prismatic:#5ce0f0; --prismatic-bg:#123038;
    --s:#e5484d; --a:#f0b93b; --b:#3fb950;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{overflow:hidden}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
  header{padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    position:sticky;top:0;background:linear-gradient(180deg,#10151d,#0b0e13);z-index:10}
  h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:24px;border:1px solid var(--line)}
  .tab{padding:6px 16px;border-radius:20px;cursor:pointer;color:var(--dim);font-weight:600;user-select:none}
  .tab.on{color:#08222a;background:var(--accent)}
  .searchbox{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
  .searchbox svg{position:absolute;left:12px;opacity:.5}
  input#q{width:100%;padding:9px 14px 9px 36px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:14px;outline:none}
  input#q:focus{border-color:var(--accent)}
  .note{font-size:12px;color:var(--dim);padding:7px 20px;background:#0e131a;
    border-bottom:1px solid var(--line)}
  .note b{color:#c2ccd8}
  .note .legal{display:block;margin-top:3px;color:#a7b1be}
  .wrap{display:flex;height:calc(100vh - 108px)}
  .list{width:270px;overflow-y:auto;border-right:1px solid var(--line);flex-shrink:0}
  .list-hd{padding:8px 14px 4px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .row{display:flex;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;
    border-left:3px solid transparent}
  .row:hover{background:var(--panel)}
  .row.on{background:var(--panel2);border-left-color:var(--accent)}
  .row img{width:34px;height:34px;border-radius:7px;background:#222;flex-shrink:0;object-fit:cover}
  .row .nm{font-weight:600}
  .row .cn{color:var(--dim);font-size:12px}
  .detail{flex:1;overflow-y:auto;padding:20px 26px 60px}
  .cheader{display:flex;gap:15px;align-items:center;margin-bottom:20px}
  .cheader img{width:66px;height:66px;border-radius:12px;box-shadow:0 2px 10px #0007}
  .cheader .big{font-size:22px;font-weight:800}
  .cheader .cn{color:var(--dim);font-size:13px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin-bottom:14px}
  .plan-card{padding:14px 15px}
  .plan-hd{display:flex;gap:10px;align-items:center}
  .grade{font-weight:800;font-size:13px;min-width:30px;text-align:center;padding:3px 8px;border-radius:7px}
  .grade.S,.grade.SS{background:var(--s);color:#fff;box-shadow:0 0 12px #e5484d55}
  .grade.A{background:var(--a);color:#1a1205}
  .grade.B,.grade.C{background:var(--b);color:#062411}
  .plan-name{font-weight:700;font-size:15px}
  .desc{color:var(--dim);font-size:13px;margin:8px 0 4px;font-style:italic}
  .plan-desc{margin:8px 0 2px;color:var(--dim)}
  .plan-desc summary{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;list-style:none}
  .plan-desc summary::-webkit-details-marker{display:none}
  .plan-desc-preview{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:12px;font-style:italic}
  .plan-desc-toggle{flex:0 0 auto;color:var(--accent);font-size:10px;font-style:normal;font-weight:750}
  .plan-desc-toggle::before{content:'Xem thêm'}
  .plan-desc[open] .plan-desc-preview{display:none}
  .plan-desc[open] .plan-desc-toggle::before{content:'Thu gọn'}
  .plan-desc[open] .desc{margin:7px 0 2px;line-height:1.55}
  .plan-layout{display:grid;grid-template-columns:minmax(175px,.28fr) minmax(0,1fr);gap:16px;align-items:start}
  .plan-layout.no-core{grid-template-columns:1fr}
  .plan-core,.plan-loadout{min-width:0}
  .plan-layout .sub{margin-top:12px}
  .alt-plans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 14px;padding:9px 11px;
    border:1px solid #263d4b;border-radius:11px;background:#0b171f}
  .alt-plans-label{color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.55px}
  .alt-plan{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:5px 9px;border:1px solid var(--line);
    border-radius:9px;background:var(--panel2);font-size:11px;font-weight:700}
  .alt-plan .grade{min-width:21px;padding:2px 5px;font-size:9px}
  .sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
    margin:12px 0 7px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:500}
  .chip.plain{padding-left:11px}
  .chip img{width:26px;height:26px;border-radius:6px;background:#0d1117;flex-shrink:0}
  .chip.silver{background:var(--silver-bg);border-color:#465064}
  .chip.gold{background:var(--gold-bg);border-color:#6b551f;color:#ffe6ad}
  .chip.prismatic{background:var(--prismatic-bg);border-color:var(--prismatic);
    box-shadow:0 0 0 1px #5ce0f055 inset,0 0 10px #5ce0f022}
  .chip.link{cursor:pointer}
  .chip.link:hover{filter:brightness(1.25);border-color:var(--accent)}
  .novi{color:var(--gold);font-size:10px;opacity:.85;margin-left:3px}
  .tier-row{margin-bottom:12px}
  .tier-row:last-child{margin-bottom:0}
  .tier-lbl{display:inline-block;font-weight:800;font-size:12px;padding:2px 10px;border-radius:6px;margin-bottom:7px}
  .tier-lbl.silver{color:#0a0d12;background:var(--silver)}
  .tier-lbl.gold{color:#1a1205;background:var(--gold)}
  .tier-lbl.prismatic{color:#052027;background:var(--prismatic)}
  .locked{font-size:10px;color:var(--dim)}
  .empty{color:var(--dim);padding:60px 20px;text-align:center}
  .eff{margin:6px 0 0;color:var(--txt);line-height:1.6}
  .badge-tier{display:inline-block;font-weight:800;font-size:12px;padding:2px 10px;border-radius:6px;vertical-align:middle}
  .mt{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.3px;
    margin-left:7px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;vertical-align:middle}
  .gold{color:var(--gold);font-weight:700}
  .items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:2px}
  .item-row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;
    align-items:center;column-gap:8px;min-width:0;padding:8px 9px;border:1px solid #233947;border-radius:10px;
    background:#0a151d}
  .item-num{position:absolute;left:3px;top:3px;display:grid;place-items:center;width:16px;height:16px;
    border-radius:5px;background:#203541;color:#c5d5de;font-weight:850;font-size:9px;z-index:1}
  .item-row img{grid-row:1/3;width:36px;height:36px;border-radius:8px;background:#0d1117;flex-shrink:0}
  .item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}
  .item-row .gold{font-size:10px;line-height:1.1}
  .build-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;
    flex-wrap:wrap;margin-top:2px;padding-top:8px;border-top:1px dashed var(--line)}
  .total{color:var(--dim);font-size:11px}
  .hint{color:var(--dim);font-size:11px;margin-top:5px}
  /* --- playaram.gg: dữ liệu thực chiến (win-rate) --- */
  .pa-title{display:flex;align-items:center;gap:9px;margin:26px 0 6px;font-size:15px;font-weight:800}
  .pa-title .src-tag{font-weight:600}
  .src-tag{font-size:10px;color:var(--dim);font-weight:600;border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;letter-spacing:.3px}
  .wr-hi{color:#3fb950;font-weight:800}
  .wr-lo{color:#e5765a;font-weight:800}
  .pick{color:var(--dim);margin-left:6px;font-size:12px}
  .chip-stat{margin-left:8px;font-size:12px;white-space:nowrap}
  .cluster{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .cluster-core{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cluster-core img{width:38px;height:38px;border-radius:8px;background:#0d1117;flex-shrink:0}
  .cluster-core .plus{color:var(--dim);font-weight:800}
  .cc-name{font-weight:700}
  .cc-stat{margin-left:auto;font-size:14px;white-space:nowrap;padding-left:10px}
  .cluster-lbl{font-size:11px;color:var(--dim);margin:9px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  .cluster-opts{display:flex;flex-wrap:wrap;gap:6px}
  .pool{display:flex;flex-wrap:wrap;gap:7px}
  .pa-item{font-size:12px}
  .pa-item img{width:24px;height:24px;border-radius:5px;background:#0d1117;flex-shrink:0}
  /* --- 游侠网 (ali213): lối chơi + bậc lõi meta S/A/B --- */
  .ali-title{display:flex;align-items:center;gap:9px;margin:26px 0 6px;font-size:15px;font-weight:800}
  .ali-build{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
  .ali-ps{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ali-src{font-size:11px;color:var(--accent);text-decoration:none;border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;font-weight:600}
  .ali-src:hover{border-color:var(--accent)}
  .philo{color:#cdd6e0;font-size:13.5px;line-height:1.65;margin:9px 0 3px;
    padding:9px 12px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
  .rk{display:inline-block;font-weight:800;font-size:12px;min-width:26px;text-align:center;
    padding:2px 8px;border-radius:6px;margin-right:8px}
  .rk.S{background:var(--s);color:#fff}
  .rk.A{background:var(--a);color:#1a1205}
  .rk.B{background:var(--b);color:#062411}
  .ali-tier{display:flex;align-items:flex-start;gap:4px;margin-bottom:9px;flex-wrap:wrap}
  .ali-tier .chips{flex:1}
  /* --- Nguồn Trung Quốc mở rộng: ARAMKit + JunzeLabs/Douyin --- */
  .cn-source-head{display:flex;align-items:center;gap:9px;margin:26px 0 9px;font-size:15px;font-weight:850;flex-wrap:wrap}
  .cn-source-head .spacer{flex:1}
  .source-link{color:var(--accent);text-decoration:none;font-size:11px;font-weight:750}
  .source-link:hover{text-decoration:underline}
  .variant-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:13px}
  .variant{padding:13px;border:1px solid #294150;border-radius:13px;background:#0e1b25}
  .variant.is-novel{border-color:#765b22;background:linear-gradient(135deg,#211d12,#101b24)}
  .variant-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .variant-rank{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#203441;color:#d8f8ff;font-weight:850;font-size:11px}
  .novel-tag{padding:2px 7px;border-radius:6px;background:#f0b93b;color:#231805;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.45px}
  .variant-stats{margin-left:auto;display:flex;gap:7px;color:var(--dim);font-size:10px;white-space:nowrap}
  .variant-stats strong{color:#d8e5eb}
  .lift-pos{color:#55d98a!important}
  .variant-items{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .variant-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
  .variant-item img{width:30px;height:30px;border-radius:7px;background:#071017}
  .variant-plus{color:#637887;font-weight:850}
  .combo-list{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 7px;scrollbar-width:thin}
  .combo{flex:0 0 auto;min-width:215px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#0d1922}
  .combo-augs{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:750}
  .combo-augs img{width:26px;height:26px;border-radius:6px}
  .combo-stats{margin-top:7px;color:var(--dim);font-size:10px}
  .sample-low{color:#ffc96b;font-weight:800}
  .special-build{padding:14px 15px;margin-bottom:10px;border:1px solid #593f75;border-radius:14px;
    background:linear-gradient(135deg,#1d1628,#101b24)}
  .special-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .special-head .spacer{flex:1}
  .special-label{padding:3px 8px;border-radius:7px;background:#8d5bd1;color:#fff;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.55px}
  .special-name{font-size:14px;font-weight:800}
  .special-augment{color:#d6b7ff;font-size:11px;font-weight:750}
  .special-logic{color:#d5dde4;font-size:12.5px;line-height:1.6;margin:9px 0}
  .special-note{color:var(--dim);font-size:11px;margin-top:9px}

  /* --- 2026 UX refresh: battle-ready shell, navigation and responsive UI --- */
  :root{
    --bg:#071017; --panel:#0f1a23; --panel2:#15232f; --panel3:#1c2d3b;
    --line:#243746; --txt:#f1f6f9; --dim:#91a4b3; --accent:#55d6e8;
    --accent2:#a7f3ff; --shadow:0 18px 50px #0007;
  }
  body{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh;
    min-height:0;overflow:hidden;background:
    radial-gradient(circle at 80% -20%,#123545 0,transparent 35%),var(--bg)}
  button,input{font:inherit}
  button{color:inherit}
  header{position:relative;top:auto;display:grid;grid-template-columns:auto auto minmax(280px,1fr);
    gap:18px;padding:12px 20px;background:#09131be8;backdrop-filter:blur(18px);
    box-shadow:0 1px 0 #ffffff08;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;min-width:max-content}
  .brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
    color:#071017;background:linear-gradient(145deg,var(--accent2),#31b7d0);
    box-shadow:0 0 24px #55d6e833;font-size:19px}
  .brand-copy{display:flex;flex-direction:column;line-height:1.15}
  .brand-copy h1{font-size:15px;letter-spacing:.8px}
  .brand-copy small{margin-top:4px;color:var(--dim);font-size:10px;letter-spacing:.35px}
  .tabs{align-self:center;padding:3px;background:#0b151e;border-color:#203341}
  .tab{appearance:none;border:0;background:transparent;padding:7px 15px}
  .tab:hover{color:var(--txt)}
  .tab:focus-visible,.row:focus-visible,.clear:focus-visible,.copy-link:focus-visible,
  .mobile-back:focus-visible,.tier-filter:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tab.on{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 5px 18px #55d6e822}
  .searchbox{align-self:center;max-width:780px;justify-self:stretch}
  input#q{height:42px;padding:9px 92px 9px 39px;border-radius:12px;background:#0b151eee;
    border-color:#294454;transition:border-color .15s,box-shadow .15s}
  input#q:focus{box-shadow:0 0 0 3px #55d6e817}
  .clear{position:absolute;right:51px;width:26px;height:26px;border:0;border-radius:7px;
    background:transparent;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
  .clear:hover{background:var(--panel3);color:var(--txt)}
  .shortcut{position:absolute;right:9px;padding:3px 7px;border:1px solid var(--line);
    border-radius:6px;color:var(--dim);font-size:10px;background:#101c25}
  .source-note{flex:none;border-bottom:1px solid var(--line);background:#0a141c;color:var(--dim);
    font-size:11px;z-index:15}
  .source-note summary{display:flex;align-items:center;justify-content:space-between;gap:16px;
    min-height:34px;padding:6px 20px;cursor:pointer;list-style:none}
  .source-note summary::-webkit-details-marker{display:none}
  .trust-copy{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trust-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:#43d17b;
    box-shadow:0 0 10px #43d17b88}
  .source-toggle{color:var(--accent);font-weight:700;white-space:nowrap}
  .source-note[open] .source-toggle::after{content:'  ×'}
  .source-body{padding:10px 20px 12px;border-top:1px solid #ffffff08;line-height:1.6}
  .source-body .legal{display:block;margin-top:3px}
  .wrap{display:grid;grid-template-columns:310px minmax(0,1fr);min-width:0;min-height:0;
    height:100%;overflow:hidden}
  .sidebar{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
    background:#09131a;border-right:1px solid var(--line)}
  .list-toolbar{flex:none;padding:13px 14px 10px;border-bottom:1px solid #ffffff08}
  .list-hd{padding:0;color:var(--dim);font-weight:750;letter-spacing:.65px}
  .tier-filters{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
  .tier-filters[hidden]{display:none}
  .tier-filter{border:1px solid var(--line);background:transparent;color:var(--dim);padding:4px 8px;
    border-radius:7px;font-size:10px;font-weight:700;cursor:pointer}
  .tier-filter:hover,.tier-filter.on{color:var(--txt);background:var(--panel2)}
  .tier-filter.on{border-color:#4f7d90}
  .list{width:auto;flex:1;min-height:0;border:0;padding:8px;overflow-y:auto;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;
    scrollbar-color:#3b6476 transparent}
  .row{appearance:none;width:100%;text-align:left;border:1px solid transparent;border-left:1px solid transparent;
    background:transparent;border-radius:11px;padding:8px 9px;margin-bottom:2px;transition:.14s ease}
  .row:hover,.row.kbd{background:var(--panel);border-color:#203541;transform:translateX(2px)}
  .row.on{background:linear-gradient(100deg,#17313e,#10212b);border-color:#2b5365;
    box-shadow:inset 3px 0 var(--accent)}
  .row img{width:38px;height:38px;border-radius:10px}
  .row .nm{font-size:13.5px}
  .row .cn{display:block;margin-top:1px;font-size:11px}
  .detail{width:auto;min-width:0;min-height:0;height:100%;padding:0;overflow-x:hidden;overflow-y:auto;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;
    scrollbar-color:#3b6476 transparent;
    background:linear-gradient(135deg,#081119aa,#0a141c55)}
  .list::-webkit-scrollbar,.detail::-webkit-scrollbar{width:10px}
  .list::-webkit-scrollbar-track,.detail::-webkit-scrollbar-track{background:transparent}
  .list::-webkit-scrollbar-thumb,.detail::-webkit-scrollbar-thumb{background:#315466;
    border:2px solid transparent;border-radius:999px;background-clip:padding-box}
  .list::-webkit-scrollbar-thumb:hover,.detail::-webkit-scrollbar-thumb:hover{background:#4a7b90;
    border:2px solid transparent;background-clip:padding-box}
  .detail-content{width:min(100%,1040px);margin:0 auto;padding:24px 28px 70px}
  .landing{width:min(640px,calc(100% - 48px));margin:auto;text-align:center;padding:52px 26px;
    border:1px solid #223744;border-radius:24px;background:linear-gradient(145deg,#101e28bb,#0c171f99);
    box-shadow:var(--shadow)}
  .landing-icon{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 18px;border-radius:22px;
    font-size:30px;color:#071017;background:linear-gradient(145deg,var(--accent2),var(--accent));
    box-shadow:0 0 35px #55d6e82e}
  .landing h2{margin:0 0 8px;font-size:23px}
  .landing p{max-width:470px;margin:0 auto;color:var(--dim)}
  .landing-tips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}

  kbd{padding:2px 5px;border-radius:5px;background:var(--panel3);border:1px solid #3b4d5b;

  .cheader{position:relative;margin-bottom:18px;padding:17px;border:1px solid #294151;border-radius:18px;

  .detail:focus{outline:none}

const packed = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
function unpack(x){
  if(Array.isArray(x)) return x.map(unpack);
  if(x && typeof x==='object'){
    if(Object.hasOwn(x,'$s')) return packed.strings[x.$s];
    return Object.fromEntries(Object.entries(x).map(([k,v])=>[k,unpack(v)]));
  }
  return x;
}

const TIER_VI = {silver:'Bạc', gold:'Vàng', prismatic:'Kim Cương'};
let mode = 'champ', sel = null, tierFilter = 'all', keyboardPos = -1;
let visibleIndexes = [];
let libraryFilter = 'all';
function readLocal(key, fallback){try{const value=JSON.parse(localStorage.getItem(key));return Array.isArray(value)?value:fallback;}catch(_){return fallback;}}
let favorites = new Set(readLocal('aram:favorites', [])), recents = readLocal('aram:recents', []);
function saveLocal(){try{localStorage.setItem('aram:favorites',JSON.stringify([...favorites]));localStorage.setItem('aram:recents',JSON.stringify(recents));}catch(_){/* Browsing still works when storage is unavailable. */}}
function entityKey(o){return mode+'/'+o.slug;}
function toggleFavorite(){
  const o=(mode==='champ'?DB.champions:DB.augments)[sel], key=entityKey(o);
  if(favorites.has(key)) favorites.delete(key); else favorites.add(key);
  saveLocal(); renderList();
  const b=document.getElementById('favoriteButton');b.setAttribute('aria-pressed',favorites.has(key));b.textContent=favorites.has(key)?'★':'☆';
  showToast(favorites.has(key)?'Đã lưu để tìm nhanh':'Đã bỏ lưu');
}
function favoriteButton(o){return `<button id="favoriteButton" class="copy-link favorite" onclick="toggleFavorite()" aria-label="Lưu mục này" title="Lưu mục này" aria-pressed="${favorites.has(entityKey(o))}">${favorites.has(entityKey(o))?'★':'☆'}</button>`;}
function jumpToSection(id){document.getElementById(id)?.scrollIntoView({block:'start'});}
function syncMobilePanels(){
  const mobile=matchMedia('(max-width:700px)').matches;
  const selected=document.body.classList.contains('has-selection');
  for(const selector of ['header','.source-note','.sidebar']) document.querySelector(selector).inert=mobile&&selected;
  document.getElementById('detail').inert=mobile&&!selected;
}

// map tên Trung lõi -> index augment, để cross-link + tooltip hiệu ứng từ champ view
const augByCn = {};
DB.augments.forEach((a,i)=>{ if(a.name_cn) augByCn[a.name_cn]=i; });
const augByVi = Object.fromEntries(DB.augments.flatMap((a,i)=>a.name_vi?[[a.name_vi,i]]:[]));

function nm(x){
  if(!x) return '';
  if(x.name_vi) return esc(x.name_vi);
  return esc(x.name_cn||'') + '<span class="novi">[chưa có bản Việt]</span>';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function augChip(a){
  const idx = augByCn[a.name_cn] ?? augByVi[a.name_vi];
  const A = idx!=null ? DB.augments[idx] : null;
  const eff = A ? (A.effect_vi_mt || A.effect_cn || '') : '';
  const tier = a.tier ? ' '+a.tier : '';
  const ic = a.icon ? `<img src="${a.icon}" onerror="this.remove()">` : '';
  const cls = idx!=null ? ' link' : (ic?'':' plain');
  const click = idx!=null ? ` onclick="gotoAug(${idx})"` : '';
  const tag=idx!=null?'button':'span';
  return `<${tag} class="chip${tier}${cls}"${click} title="${esc(eff)}">${ic}${nm(a)}</${tag}>`;
}
function gold(n){ return (n||0).toLocaleString('vi-VN'); }
// A source list is not a verified purchase order or six-slot loadout.
function itemsHTML(items, total, orderLocked=false){
  const rows = items.map((i,n)=>{
    const ic = i.image ? `<img src="${i.image}" onerror="this.style.visibility='hidden'">`
                       : '<img style="visibility:hidden">';
    const g = i.gold ? `<span class="gold">${gold(i.gold)}</span>` : '';
    return `<div class="item-row" title="${esc(i.name_vi||i.name_cn||'')}">${ic}<span class="item-name">${nm(i)}</span>${g}</div>`;
  }).join('');
  const t = `<span class="total">${items.length} món nguồn đề cập · chọn theo trận, không phải thứ tự mua${items.length>6?' · không mua đồng thời tất cả':''}</span>`;
  const lock = `<span class="locked">Giá tham khảo DDragon; giá trong Mayhem có thể khác.${orderLocked?' Nguồn không công khai thứ tự mua.':''}</span>`;
  const foot = (t||lock) ? `<div class="build-foot">${t}${lock}</div>` : '';
  return `<div class="items">${rows}${foot}</div>`;
}
// Nhãn "dịch tự động" cho chuỗi không có bản Riot (tên build, mô tả chiến thuật).
function mtHTML(vi, cn){
  if(vi) return esc(vi)+'<span class="mt">dịch tự động</span>';
  return esc(cn);
}

function matchRow(o, term){
  const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/['’\s-]/g,'');
  term = normalize(term);
  return [o.name_vi,o.name_cn,o.slug,...(o.aliases||[])].some(s=>normalize(s).includes(term));
}

function renderList(){
  const term = document.getElementById('q').value.trim();
  const src = mode==='champ' ? DB.champions : DB.augments;
  const entries = src.map((o,idx)=>({o,idx})).filter(({o})=>
    (!term || matchRow(o,term)) && (mode!=='aug' || tierFilter==='all' || o.tier===tierFilter) &&
    (libraryFilter==='all'||(libraryFilter==='saved'?favorites.has(entityKey(o)):recents.includes(entityKey(o)))));
  if(libraryFilter==='recent') entries.sort((a,b)=>recents.indexOf(entityKey(a.o))-recents.indexOf(entityKey(b.o)));
  visibleIndexes = entries.map(x=>x.idx);
  keyboardPos = -1;
  const el = document.getElementById('list');
  document.getElementById('listHd').textContent = `${entries.length} ${mode==='champ'?'TƯỚNG':'LÕI'}`;
  document.getElementById('tierFilters').hidden = mode!=='aug';
  el.innerHTML = entries.map(({o,idx})=>{
    const img = (o.image||o.icon) ? `<img loading="lazy" decoding="async" alt="" src="${o.image||o.icon}" onerror="this.style.visibility='hidden'">` : '<img alt="" style="visibility:hidden">';
    const sub = (mode==='aug' && o.tier)
      ? `<span class="tier-lbl ${o.tier}" style="margin:0;font-size:10px;padding:1px 7px">${TIER_VI[o.tier]||''}</span>`
      : `<span class="cn">${esc(o.name_cn)}</span>`;
    return `<button class="row${sel===idx?' on':''}" onclick="pick(${idx})" aria-current="${sel===idx}">${img}
      <span class="row-copy"><span class="nm">${nm(o)}</span>${sub}</span>${favorites.has(entityKey(o))?'<span class="saved-star" aria-label="Đã lưu">★</span>':''}</button>`;
  }).join('') || `<div class="empty">${libraryFilter==='saved'?'Chưa lưu mục nào phù hợp. Mở tướng/lõi rồi bấm ☆ để lưu.':libraryFilter==='recent'?'Chưa có lịch sử phù hợp. Chuyển về tất cả để bắt đầu.':'Không tìm thấy. Thử tên không dấu hoặc tên tiếng Anh.'}</div>`;
}

function pick(idx, updateHash=true){
  const o = (mode==='champ'?DB.champions:DB.augments)[idx];
  if(!o) return;
  sel = idx;
  recents=[entityKey(o),...recents.filter(k=>k!==entityKey(o))].slice(0,16);saveLocal();renderList();
  const d = document.getElementById('detail');
  d.innerHTML = `<div class="detail-content">${mode==='champ' ? champHTML(o) : augHTML(o)}</div>`;
  d.scrollTop = 0;
  document.body.classList.add('has-selection');
  syncMobilePanels();
  d.querySelectorAll('img').forEach(img=>{if(!img.hasAttribute('alt'))img.alt='';img.loading='lazy';img.decoding='async';});
  d.focus({preventScroll:true});
  if(updateHash) history.replaceState(null,'',`#${mode}/${encodeURIComponent(o.slug)}`);
}

// ---- playaram.gg: %win-rate & pick thật (suy từ lịch sử đấu Riot) ----------
function wrCls(wr){ return parseFloat(wr)>=50 ? 'wr-hi' : 'wr-lo'; }
function paStat(wr,pick){
  const w = wr ? `<span title="Tỉ lệ thắng từ nguồn; không thể suy ra độ tin cậy khi thiếu số mẫu">Thắng ${esc(wr)}</span>` : '';
  const p = pick ? `<span class="pick">Chọn ${esc(pick)}</span>` : '';
  return w+p;
}
function paIcon(it,sm){
  const s = sm ? ' class="pa-item"' : '';
  return it.icon ? `<img src="${it.icon}"${sm?' style="width:24px;height:24px"':''} onerror="this.style.visibility='hidden'">`
                 : '<img style="visibility:hidden">';
}
const SPELL_FILES = {
  'Tốc Biến':'SummonerFlash.png', 'Tốc Hành':'SummonerHaste.png',
  'Đánh Dấu':'SummonerSnowball.png', 'Thiêu Đốt':'SummonerDot.png',
  'Hồi Máu':'SummonerHeal.png', 'Lá Chắn':'SummonerBarrier.png',
  'Thanh Tẩy':'SummonerBoost.png', 'Minh Mẫn':'SummonerMana.png',
  'Kiệt Sức':'SummonerExhaust.png'
};
function spellIcons(label){
  const icons = String(label||'').split(/\s*\+\s*/).map(name=>{
    const file=SPELL_FILES[name];
    return file ? `<img src="https://ddragon.leagueoflegends.com/cdn/${META.ddragon_version}/img/spell/${file}"
      alt="${esc(name)}" title="${esc(name)}" onerror="this.style.visibility='hidden'">` : '';
  }).join('');
  return icons ? `<span class="spell-icons">${icons}</span>` : '';
}
// item lẻ trong pool/giày: chip nhỏ có tên + wr/pick
function paItemChip(it){
  const ic = it.icon ? `<img src="${it.icon}" onerror="this.style.visibility='hidden'">` : '<img style="visibility:hidden">';
  const st = (it.wr||it.pick) ? `<span class="chip-stat">${paStat(it.wr,it.pick)}</span>` : '';
  return `<span class="chip plain pa-item">${ic}<span>${esc(it.name_vi||'')}</span>${st}</span>`;
}
// lõi theo win-rate: link sang trang chi tiết nếu có ref
function paAugChip(a){
  const ic = a.icon ? `<img src="${a.icon}" onerror="this.remove()">` : '';
  const cls = a.ref!=null ? ' link' : (ic?'':' plain');
  const click = a.ref!=null ? ` onclick="gotoAug(${a.ref})"` : '';
  const st = `<span class="chip-stat">${paStat(a.wr,a.pick)}</span>`;
  const tag=a.ref!=null?'button':'span';
  return `<${tag} class="chip ${a.tier}${cls}"${click}>${ic}${esc(a.name_vi||'')}${st}</${tag}>`;
}
function playaramHTML(pa){
  let h = `<div class="pa-title">Dữ liệu PlayARAM <span class="src-tag">Snapshot ${esc(META.sources.playaram.snapshot)}</span></div>
    <div class="data-warning">Nguồn chưa truy cập lại được. Chưa xác minh patch/số mẫu; không dùng % thắng để kết luận lựa chọn mạnh nhất.</div>`;

  // Build cốt lõi: các cặp item hoàn thiện đầu, XẾP THEO THỰC CHIẾN (thay "thứ tự khoá")
  if(pa.core_builds && pa.core_builds.length){
    h += `<div class="sub">Build cốt lõi — xếp theo tỉ lệ chọn thực tế</div>`;
    for(const cb of [...pa.core_builds].sort((a,b)=>pctNum(b.pick)-pctNum(a.pick)).slice(0,4)){
      const core = cb.core.map((it,n)=>
        (n?'<span class="plus">+</span>':'')+paIcon(it)+`<span class="cc-name">${esc(it.name_vi||'')}</span>`
      ).join(' ');
      h += `<div class="cluster"><div class="cluster-core">${core}
        <span class="cc-stat">${paStat(cb.wr,cb.pick)}</span></div>`;
      if(cb.options && cb.options.length){
        h += `<div class="cluster-lbl">Hay lên kèm</div><div class="cluster-opts">${cb.options.map(paItemChip).join('')}</div>`;
      }
      h += `</div>`;
    }
  }
  // Pool item thay thế (thay phần "pool bị khoá" của lolhaidou)
  if(pa.other_items && pa.other_items.length){
    h += `<div class="sub">Pool trang bị khác</div><div class="card"><div class="pool">${pa.other_items.map(paItemChip).join('')}</div></div>`;
  }
  // Giày + Phép
  let gp = '';
  if(pa.boots && pa.boots.length)
    gp += `<div class="sub">Giày</div><div class="pool" style="margin-bottom:12px">${pa.boots.map(paItemChip).join('')}</div>`;
  if(pa.spells && pa.spells.length)
    gp += `<div class="sub">Phép bổ trợ</div><div class="pool">${pa.spells.map(s=>
      `<span class="chip plain pa-item">${spellIcons(s.name)}<span>${esc(s.name)}</span><span class="chip-stat">${paStat(s.wr,s.pick)}</span></span>`).join('')}</div>`;
  if(gp) h += `<div class="card">${gp}</div>`;

  // Lõi theo win-rate (3 bậc) — bổ sung % cho phần lõi định tính của lolhaidou
  const tiers = ['prismatic','gold','silver'];
  const hasAug = pa.augments && tiers.some(t=>pa.augments[t] && pa.augments[t].length);
  if(hasAug){
    h += `<div class="sub">Lõi theo bậc · xếp theo tỉ lệ chọn</div><div class="card">`;
    for(const t of tiers){
      const list = [...(pa.augments[t]||[])].sort((a,b)=>pctNum(b.pick)-pctNum(a.pick)).slice(0,8);
      if(!list.length) continue;
      h += `<div class="tier-row"><span class="tier-lbl ${t}">${TIER_VI[t]}</span>
        <div class="chips">${list.map(paAugChip).join('')}</div></div>`;
    }
    h += `</div>`;
  }
  return h;
}

// ---- 游侠网 (ali213): lối chơi (tôn chỉ) + xếp bậc lõi meta S/A/B -----------
// Chip lõi ali213: link sang trang chi tiết nếu map được (ref), tô màu theo độ hiếm.
function aliAugChip(a){
  const ic = a.icon ? `<img src="${a.icon}" onerror="this.remove()">` : '';
  const cls = a.ref!=null ? ' link' : (ic?'':' plain');
  const click = a.ref!=null ? ` onclick="gotoAug(${a.ref})"` : '';
  const tier = a.tier ? ' '+a.tier : '';
  const tag=a.ref!=null?'button':'span';
  return `<${tag} class="chip${tier}${cls}"${click}>${ic}${nm(a)}</${tag}>`;
}
function aliHTML(builds){
  let h = `<div class="ali-title">Lối chơi & bậc lõi <span class="src-tag">游侠网 · bài hướng dẫn cũ</span></div><div class="data-warning">Chưa xác minh lại cho patch hiện tại. Xếp hạng là ý kiến tác giả, không phải thống kê.</div>`;
  const RK = {S:'S', A:'A', B:'B'};
  for(const b of builds){
    const ps = b.playstyle_vi
      ? esc(b.playstyle_vi)+'<span class="mt">dịch tự động</span>'
      : esc(b.playstyle||'Lối chơi');
    const src = b.url ? `<a class="ali-src" href="${esc(b.url)}" target="_blank" rel="noopener">nguồn ↗</a>` : '';
    h += `<div class="ali-build"><div class="ali-ps">${ps}${src}</div>`;
    // triết lý / tôn chỉ lối chơi
    if(b.philosophy_vi)
      h += `<div class="philo">${esc(b.philosophy_vi)}<span class="mt">dịch tự động</span></div>`;
    else if(b.philosophy_cn)
      h += `<div class="philo">${esc(b.philosophy_cn)}<span class="mt">bản Trung — chưa dịch</span></div>`;
    // xếp bậc lõi meta S/A/B
    for(const rk of ['S','A','B']){
      const list = (b.tiers&&b.tiers[rk])||[];
      if(!list.length) continue;
      h += `<div class="sub" style="margin-bottom:5px">Bậc ${RK[rk]}</div>
        <div class="ali-tier"><span class="rk ${rk}">${RK[rk]}</span>
        <div class="chips">${list.map(aliAugChip).join('')}</div></div>`;
    }
    // lõi cần tối thiểu
    if(b.essential&&b.essential.length)
      h += `<div class="sub">Lõi cần (có 1 trong số này là chơi được)</div>
        <div class="chips">${b.essential.map(aliAugChip).join('')}</div>`;
    if(b.tips_vi||b.tips_cn)
      h += `<div class="desc" style="margin-top:10px">💡 ${b.tips_vi?esc(b.tips_vi)+' ':''}${b.tips_vi?'':esc(b.tips_cn)}</div>`;
    h += `</div>`;
  }
  return h;
}

// ---- ARAMKit 中文: 5 core build + combo lõi, giữ win/pick/lift riêng --------
function pctNum(value){ return parseFloat(String(value||'').replace('%',''))||0; }
function sourceItem(it){
  const icon = it.icon ? `<img src="${it.icon}" onerror="this.style.visibility='hidden'">` : '';
  return `<span class="variant-item">${icon}<span>${esc(it.name_vi||it.name_cn||'')}</span></span>`;
}
function sourceAug(a){
  const icon = a.icon ? `<img src="${a.icon}" onerror="this.style.visibility='hidden'">` : '';
  return `${icon}<span>${esc(a.name_vi||a.name_cn||'')}</span>`;
}
function aramkitHTML(data){
  if(!data || !(data.core_builds||[]).length) return '';
  const source = data.url ? `<a class="source-link" href="${esc(data.url)}" target="_blank" rel="noopener">xem nguồn ↗</a>` : '';
  let h = `<div class="cn-source-head">Các bộ trang bị từ ARAMKit
    <span class="src-tag">ARAMKit 中文 · Patch ${esc(data.patch||'?')} · ${esc(data.data_date||'')}</span><span class="spacer"></span>${source}</div>`;
  const archetypes={'AP':'Pháp thuật','AD':'Vật lý','坦克':'Chống chịu','暴击':'Chí mạng','战士':'Đấu sĩ','特效':'Hiệu ứng đòn đánh','功能':'Đa dụng','穿甲':'Xuyên giáp'};
  h += `<div class="source-caption">Nhánh ${esc(archetypes[data.archetype]||data.archetype||'mặc định')} · WR = tỉ lệ thắng · lift = chênh lệch theo nguồn, không phải hiệu quả nhân quả.</div><div class="data-warning">Nguồn chỉ công khai số mẫu ở một số dòng. Không có số mẫu ≠ mẫu đủ lớn. Các bộ dưới đây không phải thứ tự mua.</div><div class="variant-grid">`;
  data.core_builds.slice(0,5).forEach((build,index)=>{
    const novel = pctNum(build.pick)<=5;
    const sample = build.sample ? ` · ${Number(build.sample).toLocaleString('vi-VN')} trận (nguồn cảnh báo mẫu thấp)` : ' · chưa rõ số mẫu';
    h += `<article class="variant${novel?' is-novel':''}"><div class="variant-top">
      <span class="variant-rank">#${index+1}</span>${novel?'<span class="source-chip">Ít được chọn</span>':''}
      <span class="variant-stats"><span><strong>${esc(build.wr)}</strong> WR</span>
      <span><strong>${esc(build.pick)}</strong> chọn</span><span><strong class="${pctNum(build.lift)>0?'lift-pos':''}">${esc(build.lift)}</strong> lift${sample}</span></span></div>
      <div class="variant-items">${build.items.map((it,n)=>(n?'<span class="variant-plus">+</span>':'')+sourceItem(it)).join('')}</div></article>`;
  });
  h += `</div>`;
  if((data.augment_combos||[]).length){
    h += `<div class="sub">Combo lõi nguồn liệt kê · xem cả số mẫu</div><div class="combo-list">`;
    data.augment_combos.slice(0,8).forEach(combo=>{
      const sample = combo.sample ? ` · <span class="sample-low">mẫu thấp ${Number(combo.sample).toLocaleString('vi-VN')}</span>` : ' · chưa rõ số mẫu';
      h += `<div class="combo"><div class="combo-augs">${combo.augments.map((a,n)=>(n?'<span class="variant-plus">+</span>':'')+sourceAug(a)).join('')}</div>
        <div class="combo-stats"><span class="${wrCls(combo.wr)}">${esc(combo.wr)}</span> · chọn ${esc(combo.pick)} · lift ${esc(combo.lift)}${sample}</div></div>`;
    });
    h += `</div>`;
  }
  return h;
}

// ---- JunzeLabs + tác giả Douyin: build định tính theo lõi đặc biệt ---------
function junzeHTML(builds){
  if(!builds || !builds.length) return '';
  const newest = builds[0]||{};
  let h = `<div class="cn-source-head">✨ Tham khảo thêm · Build độc lạ theo lõi đặc biệt
    <span class="src-tag">JunzeLabs · cộng đồng Trung Quốc · Patch ${esc(newest.patch||'?')} · ${esc(newest.data_date||'')}</span></div>`;
  for(const build of builds){
    const name = build.archetype_vi || build.archetype_cn || 'Build đặc biệt';
    const augment = build.augment_vi || build.augment_cn || '';
    const logic = build.logic_vi || build.logic_cn || '';
    const note = build.note_vi || build.note_cn || '';
    h += `<article class="special-build"><div class="special-head"><span class="special-label">Độc lạ</span>
      <span class="special-name">${esc(name)}</span>${augment?`<span class="special-augment">Cần: ${esc(augment)}</span>`:''}
      <span class="spacer"></span><a class="source-link" href="${esc(build.url||'https://junzelabs.com/')}" target="_blank" rel="noopener">${esc(build.source_label||'nguồn Trung Quốc')} ↗</a></div>`;
    if((build.early_core||[]).length)
      h += `<div class="sub">Core lên sớm</div><div class="variant-items">${build.early_core.map((it,n)=>(n?'<span class="variant-plus">+</span>':'')+sourceItem(it)).join('')}</div>`;
    if((build.items||[]).length)
      h += `<div class="sub">Đủ bộ</div><div class="variant-items">${build.items.map((it,n)=>(n?'<span class="variant-plus">+</span>':'')+sourceItem(it)).join('')}</div>`;
    if(logic) h += `<div class="special-logic">${esc(logic)}${build.logic_vi?'<span class="mt">dịch tự động</span>':'<span class="mt">bản Trung</span>'}</div>`;
    if(note) h += `<div class="special-note">💡 ${esc(note)}</div>`;
    h += `</article>`;
  }
  return h;
}

// Tóm tắt những gì người chơi cần nhìn thấy trước trong lúc chọn tướng.
function quickHTML(c){
  const pa = c.playaram || {};
  const core = [...(pa.core_builds||[])].sort((a,b)=>pctNum(b.pick)-pctNum(a.pick))[0];
  const spell = [...(pa.spells||[])].sort((a,b)=>pctNum(b.pick)-pctNum(a.pick))[0];
  if(!core && !spell) return '';
  let cells = '';
  if(core){
    const items = core.core.map(it=>`${paIcon(it)}<span>${esc(it.name_vi||'')}</span>`).join('');
    cells += `<div class="quick-cell"><div class="quick-label">Core phổ biến</div>
      <div class="quick-value">${items}</div><div class="quick-stat">${paStat(core.wr,core.pick)}</div></div>`;
  }
  if(spell){
    cells += `<div class="quick-cell"><div class="quick-label">Phép bổ trợ</div>
      <div class="quick-value">${spellIcons(spell.name)}<span>${esc(spell.name||'')}</span></div><div class="quick-stat">${paStat(spell.wr,spell.pick)}</div></div>`;
  }
  return `<section class="quick-card"><div class="section-kicker">Core & phép phổ biến · snapshot PlayARAM ${esc(META.sources.playaram.snapshot)}</div><div class="quick-grid">${cells}</div><div class="hint">Chưa xác minh patch/số mẫu. Gợi ý tham khảo, không phải lựa chọn tối ưu cho mọi trận.</div></section>`;
}

function champHTML(c){
  let h = `<button class="mobile-back" onclick="mobileBack()">← Quay lại danh sách</button><div class="cheader">
    ${c.image?`<img src="${c.image}" onerror="this.remove()">`:''}
    <div><div class="big">${nm(c)}</div>
    <div class="cn">${esc(c.name_cn)}${(c.aliases||[]).length?' · '+c.aliases.map(esc).join(' · '):''}</div>
    <span class="patch-pill">ARAM Mayhem · dữ liệu đa nguồn</span></div>
    <div class="header-actions">${favoriteButton(c)}<button class="copy-link" aria-label="Sao chép link" onclick="copyCurrent()">↗ Sao chép link</button></div></div>
    <nav class="section-nav" aria-label="Các phần của trang tướng">
      <button onclick="jumpToSection('builds')">Trang bị</button><button onclick="jumpToSection('augments')">Lõi</button>
      <button onclick="jumpToSection('statistics')">Số liệu</button><button onclick="jumpToSection('references')">Tham khảo</button>
    </nav><section id="builds" class="jump-section">`;

  // Phương án build là nội dung chính: đặt ngay đầu trang theo thứ tự ưu tiên UX.
  if(c.build_plans.length){
    h += `<h2 class="section-title">Phương án build</h2><div class="source-caption"><a href="https://lolhaidou.cn/hero/${encodeURIComponent(c.slug)}.html" target="_blank" rel="noopener">LolHaidou ↗</a>
      <span>Lấy ngày ${esc(META.sources.lolhaidou.snapshot)} · nguồn chưa nêu patch · S/SS/A là đánh giá định tính</span></div>`;
    const detailedPlans = c.build_plans.filter(b=>b.desc_vi||b.desc_cn||b.augments.length||b.items.length);
    const namedOnlyPlans = c.build_plans.filter(b=>!(b.desc_vi||b.desc_cn||b.augments.length||b.items.length));
    for(const [index,b] of detailedPlans.entries()){
      h += `<details class="card plan-card"${index===0?' open':''}><summary>
        <span class="grade ${b.grade}">${esc(b.grade)}</span>
        <span class="plan-name">${mtHTML(b.name_vi, b.name_cn)}</span><span class="plan-count">${b.items.length} món · ${b.augments.length} lõi</span></summary>`;
      if(b.desc_vi||b.desc_cn){
        const description = mtHTML(b.desc_vi, b.desc_cn);
        h += `<details class="plan-desc"><summary><span class="plan-desc-preview">“${description}”</span>
          <span class="plan-desc-toggle"></span></summary><div class="desc">“${description}”</div></details>`;
      }
      h += `<div class="plan-layout${b.augments.length?'':' no-core'}">`;
      if(b.augments.length)
        h += `<div class="plan-core"><div class="sub">Lõi cốt lõi</div><div class="chips">${b.augments.map(augChip).join('')}</div></div>`;
      if(b.items.length){
        h += `<div class="plan-loadout"><div class="sub">Nhóm trang bị tham khảo</div>${itemsHTML(b.items, b.gold_total, b.item_order_locked)}</div>`;
      }
      h += `</div></details>`;
    }
    if(namedOnlyPlans.length){
      h += `<div class="alt-plans"><span class="alt-plans-label">Hướng khác · nguồn chưa có chi tiết</span>${namedOnlyPlans.map(b=>
        `<span class="alt-plan"><span class="grade ${b.grade}">${esc(b.grade)}</span><span>${mtHTML(b.name_vi,b.name_cn)}</span></span>`
      ).join('')}</div>`;
    }
  }
  h += quickHTML(c);
  h += '</section><section id="augments" class="jump-section">';
  if(c.recommended_augments.length){
    h += `<h2 class="section-title">Lõi khuyến nghị theo bậc</h2><div class="source-caption">LolHaidou · đánh giá cộng đồng, chưa có số mẫu · bấm lõi để xem chi tiết</div><div class="card">`;
    const order = {prismatic:0, gold:1, silver:2};
    const recs = [...c.recommended_augments].sort((x,y)=>(order[x.tier]??9)-(order[y.tier]??9));
    for(const r of recs){
      h += `<div class="tier-row"><span class="tier-lbl ${r.tier}">${r.tier_vi||TIER_VI[r.tier]}</span>

  h += '</section><section id="statistics" class="jump-section"><h2 class="section-title">Đối chiếu số liệu</h2>';
  if(c.aramkit) h += aramkitHTML(c.aramkit);
  if(c.playaram) h += `<details class="secondary-section"><summary>PlayARAM · snapshot cũ</summary>${playaramHTML(c.playaram)}</details>`;
  h += '</section><section id="references" class="jump-section"><h2 class="section-title">Tham khảo thêm</h2><p class="hint">Các hướng dẫn dưới đây có thể thuộc bản cũ. Chỉ thử khi cơ chế lõi và trang bị trong trận còn phù hợp.</p>';
  if(c.ali213 && c.ali213.length) h += `<details class="secondary-section"><summary>Hướng dẫn cộng đồng Trung Quốc · ${c.ali213.length} bài</summary>${aliHTML(c.ali213)}</details>`;
  if(c.junze_builds && c.junze_builds.length) h += `<details class="secondary-section"><summary>Build độc lạ · ${c.junze_builds.length} hướng tham khảo</summary>${junzeHTML(c.junze_builds)}</details>`;
  h += '</section>';
  if(!c.build_plans.length && !c.recommended_augments.length && !c.playaram && !c.aramkit &&
     !(c.junze_builds&&c.junze_builds.length) && !(c.ali213&&c.ali213.length))
    h += `<div class="empty">Chưa có dữ liệu build cho tướng này.</div>`;
  return h;
}

function augHTML(a){
  let h = `<button class="mobile-back" onclick="mobileBack()">← Quay lại danh sách</button><div class="cheader">
    ${a.icon?`<img src="${a.icon}" onerror="this.remove()" style="width:56px;height:56px">`:''}
    <div><div class="big">${nm(a)}</div>
    <div class="cn"><span class="badge-tier ${a.tier}" style="background:var(--${a.tier||'line'});color:#08151a">${a.tier_vi||TIER_VI[a.tier]||'?'}</span>
      &nbsp;${esc(a.name_cn)}</div></div>
    <div class="header-actions">${favoriteButton(a)}<button class="copy-link" aria-label="Sao chép link" onclick="copyCurrent()">↗ Sao chép link</button></div></div>`;
  const eff = a.effect_vi_mt || a.effect_vi || a.effect_cn;
  if(eff){
    let lbl, tag='';
    if(a.effect_vi_mt){ lbl='Hiệu ứng theo nguồn Mayhem'; tag='<span class="mt">dịch tự động</span>'; }
    else if(a.effect_vi){ lbl='Mô tả đối chiếu từ Võ Đài'; tag='<span class="mt">locale Riot · Arena</span>'; }
    else{ lbl='Hiệu ứng (mô tả bản Trung — nguồn)'; }
    const hasVi = a.effect_vi || a.effect_vi_mt;
    const hint = (hasVi && /\(?\?\)?/.test(eff) && eff.includes('?'))
      ? '<div class="hint">(?) = giá trị trong mẫu dữ liệu chưa được giải mã; kiểm tra mô tả trong trận.</div>' : '';
    h += `<div class="card"><div class="sub">${lbl}${tag}</div><div class="eff">${esc(eff)}</div>${hint}</div>`;
    if(a.effect_vi && !a.effect_vi_mt) h += '<div class="data-warning">Không dùng các chỉ số Võ Đài này làm số chính xác cho ARAM Mayhem; cơ chế có thể khác.</div>';
    if(a.effect_cn) h += `<details class="secondary-section"><summary>Mô tả Mayhem gốc · Trung Quốc</summary><p>${esc(a.effect_cn)}</p><a class="source-link" href="https://lolhaidou.cn/augment/${encodeURIComponent(a.slug)}.html" target="_blank" rel="noopener">Đối chiếu nguồn ↗</a></details>`;
  }
  if(a.suitable_heroes.length){
    h += `<div class="sub">Tướng hợp (${a.suitable_heroes.length})</div><div class="card"><div class="chips">`;
    h += a.suitable_heroes.map(sh=>{
      const ci = DB.champions.findIndex(c=>c.slug===sh.slug);
      const img = ci>=0 && DB.champions[ci].image ? `<img src="${DB.champions[ci].image}" onerror="this.remove()">` : '';
      const cls = ci>=0 ? ' link' : (img?'':' plain');
      const on = ci>=0 ? ` onclick="gotoChamp(${ci})"` : '';
      const tag=ci>=0?'button':'span';
      return `<${tag} class="chip${cls}"${on}>${img}${nm(sh)}</${tag}>`;
    }).join('');
    h += `</div></div>`;
  }
  return h;
}

function gotoChamp(idx){ mode='champ'; tierFilter='all'; resetSearch(); pick(idx); }
function gotoAug(idx){ mode='aug'; tierFilter='all'; resetSearch(); pick(idx); }
function resetSearch(){ document.getElementById('q').value=''; libraryFilter='all'; syncTabs(); }

function mobileBack(){
  document.body.classList.remove('has-selection');
  syncMobilePanels();
  history.replaceState(null,'',location.pathname+location.search);
  document.getElementById('q').focus();
}
function showToast(message){
  const el = document.getElementById('toast');
  el.textContent = message; el.classList.add('show');
  clearTimeout(showToast.timer); showToast.timer = setTimeout(()=>el.classList.remove('show'),1800);
}
async function copyCurrent(){
  try{ await navigator.clipboard.writeText(location.href); showToast('Đã sao chép link'); }
  catch(_){ showToast('Không thể sao chép tự động'); }
}
function landingHTML(){
  return `<div class="landing"><div class="landing-icon">⚔</div><h2>Tìm build trong vài giây</h2>
    <p>Chọn một tướng hoặc chuyển sang tab Lõi. Kết quả ưu tiên thông tin cần dùng ngay trong trận.</p>
    <div class="landing-tips"><span class="tip"><kbd>⌘ K</kbd> tìm nhanh</span><span class="tip"><kbd>↑</kbd> <kbd>↓</kbd> di chuyển</span><span class="tip"><kbd>Enter</kbd> mở</span></div></div>`;
}

function syncTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    const on = t.dataset.m===mode;
    t.classList.toggle('on',on); t.removeAttribute('role');t.removeAttribute('aria-selected');t.setAttribute('aria-pressed',on);
  });
  document.querySelectorAll('.tier-filter').forEach(t=>t.classList.toggle('on',t.dataset.tier===tierFilter));
  document.getElementById('savedFilter').setAttribute('aria-pressed',libraryFilter==='saved');
  document.getElementById('recentFilter').setAttribute('aria-pressed',libraryFilter==='recent');
  document.getElementById('q').placeholder = mode==='champ'
    ? 'Tìm tướng theo tên Việt, Trung hoặc EN…' : 'Tìm lõi theo tên Việt, Trung hoặc EN…';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  mode=t.dataset.m; sel=null; tierFilter='all'; libraryFilter='all'; document.getElementById('q').value=''; syncTabs();
  document.body.classList.remove('has-selection');
  syncMobilePanels();
  document.getElementById('detail').innerHTML=landingHTML();
  history.replaceState(null,'',location.pathname+location.search);
  renderList();
});
document.querySelectorAll('.tier-filter').forEach(t=>t.onclick=()=>{
  tierFilter=t.dataset.tier; syncTabs(); renderList();
});
for(const [id,value] of [['savedFilter','saved'],['recentFilter','recent']]){
  document.getElementById(id).onclick=()=>{libraryFilter=libraryFilter===value?'all':value;syncTabs();renderList();};
}
document.getElementById('clear').onclick=()=>{
  const q=document.getElementById('q'); q.value=''; q.focus(); renderList();
};
document.getElementById('q').addEventListener('input',()=>renderList());
document.getElementById('q').addEventListener('keydown',e=>{
  if((e.key==='ArrowDown'||e.key==='ArrowUp') && visibleIndexes.length){
    e.preventDefault();
    const rows=[...document.querySelectorAll('.row')];
    keyboardPos = keyboardPos<0 ? (e.key==='ArrowDown'?0:rows.length-1)
      : (keyboardPos+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;
    rows.forEach((r,i)=>r.classList.toggle('kbd',i===keyboardPos));
    rows[keyboardPos].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter' && visibleIndexes.length){
    e.preventDefault(); pick(visibleIndexes[keyboardPos<0?0:keyboardPos]);
  }else if(e.key==='Escape'){
    if(e.currentTarget.value){e.currentTarget.value='';renderList();}else mobileBack();
  }
});
document.addEventListener('keydown',e=>{
  if(((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k') || (e.key==='/' && document.activeElement.tagName!=='INPUT')){
    e.preventDefault(); if(matchMedia('(max-width:700px)').matches)mobileBack();document.getElementById('q').focus();
  }
});
function openFromHash(){
  const [m,slug] = location.hash.replace(/^#/,'').split('/');
  if((m==='champ'||m==='aug') && slug){
    mode=m; tierFilter='all'; syncTabs(); renderList();
    const src=mode==='champ'?DB.champions:DB.augments;
    let decoded; try{decoded=decodeURIComponent(slug);}catch(_){return false;}
    const idx=src.findIndex(o=>o.slug===decoded);
    if(idx>=0){pick(idx,false);return true;}
  }
  return false;
}
window.addEventListener('hashchange',()=>{if(!openFromHash()) document.body.classList.remove('has-selection');syncMobilePanels();});
window.addEventListener('resize',syncMobilePanels);
Object.assign(window,{pick,gotoChamp,gotoAug,mobileBack,copyCurrent,toggleFavorite,jumpToSection});
document.getElementById('q').disabled=false;
document.getElementById('detail').innerHTML=landingHTML();
syncTabs();
if(!openFromHash()) renderList();
syncMobilePanels();
document.documentElement.dataset.ready='true';
})().catch(error=>{
  const el=document.getElementById('loadingStatus');
  if(el)el.textContent='Không mở được dữ liệu. '+error.message+' Hãy thử tải lại trang.';
  console.error(error);
});
</script>
